<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノンフライヤー調理レシピ shared</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #e65100;
      --border-color: #eeeeee;
    }
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      padding-bottom: 80px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"], select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .search-bar { flex: 1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .card-img-wrap {
      width: 100%;
      height: 120px;
      background: #eaeff2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-content { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
    .card-info { font-size: 0.85rem; color: var(--accent-color); font-weight: bold; }
    .card-actions { margin-top: 8px; display: flex; justify-content: flex-end; gap: 6px; }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #e0e0e0;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent-color); color: white; }
    .btn-danger { background: #d32f2f; color: white; }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--accent-color);
      color: white;
      font-size: 24px;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      box-sizing: border-box;
    }
    .img-preview {
      width: 100%;
      height: 140px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
  </style>

  <!-- Firebase SDK の読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebaseの設定情報（プロジェクト作成後に書き換えます）
    const firebaseConfig = {
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com"
    };

    let db = null;
    let itemsRef = null;

    // 初期化チェック
    if (firebaseConfig.databaseURL.includes("YOUR_PROJECT_ID")) {
      console.warn("Firebase設定が未登録です。localStorageモードで動作します。");
    } else {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      itemsRef = ref(db, 'recipes');
    }

    // アプリ内状態
    let items = [];
    let currentEditId = null;
    let editingImageData = "";

    // DOM要素
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const searchInput = document.getElementById('search');
    const imgInput = document.getElementById('imgInput');
    const imgPreview = document.getElementById('imgPreview');
    const removeImgBtn = document.getElementById('removeImgBtn');

    // データの読み込み＆他ユーザーからの変更監視
    function initDataSync() {
      if (itemsRef) {
        onValue(itemsRef, (snapshot) => {
          const data = snapshot.val();
          items = data ? Object.values(data) : [];
          render();
        });
      } else {
        const local = localStorage.getItem('cosori_items');
        items = local ? JSON.parse(local) : [];
        render();
      }
    }

    // 保存処理（Firebase or LocalStorage）
    function saveData() {
      if (itemsRef) {
        set(itemsRef, items);
      } else {
        localStorage.setItem('cosori_items', JSON.stringify(items));
        render();
      }
    }

    // 画像の圧縮リサイズ処理 (800px幅, JPEG 75%品質)
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const max = 800;

            if (width > max) {
              height = Math.round((height * max) / width);
              width = max;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 画像選択時のイベント
    imgInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        editingImageData = await compressImage(file);
        updatePreview();
      }
    });

    // 画像削除ボタン
    removeImgBtn.addEventListener('click', () => {
      editingImageData = "";
      imgInput.value = "";
      updatePreview();
    });

    function updatePreview() {
      if (editingImageData) {
        imgPreview.style.backgroundImage = `url(${editingImageData})`;
        imgPreview.innerText = "";
        removeImgBtn.style.display = "inline-block";
      } else {
        imgPreview.style.backgroundImage = "none";
        imgPreview.innerText = "画像未選択";
        removeImgBtn.style.display = "none";
      }
    }

    // 一覧描画
    function render() {
      const keyword = searchInput.value.toLowerCase();
      grid.innerHTML = "";

      const filtered = items.filter(item => item.name.toLowerCase().includes(keyword));

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrap">
            ${item.image ? `<img src="${item.image}" alt="${item.name}">` : '<span>No Image</span>'}
          </div>
          <div class="card-content">
            <div>
              <div class="card-title">${item.name}</div>
              <div class="card-info">${item.temp}℃ / ${item.time}分</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-edit" data-id="${item.id}">編集</button>
              <button class="btn btn-danger btn-del" data-id="${item.id}">削除</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // 編集ボタンイベント設定
      document.querySelectorAll('.btn-edit').forEach(b => {
        b.onclick = () => openModal(b.dataset.id);
      });

      // 削除ボタンイベント設定
      document.querySelectorAll('.btn-del').forEach(b => {
        b.onclick = () => {
          if (confirm("本当に削除しますか？（全員の画面から削除されます）")) {
            items = items.filter(i => i.id !== b.dataset.id);
            saveData();
          }
        };
      });
    }

    // モーダルを開く（新規 / 編集）
    window.openModal = (id = null) => {
      currentEditId = id;
      if (id) {
        const item = items.find(i => i.id === id);
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemTemp').value = item.temp;
        document.getElementById('itemTime').value = item.time;
        editingImageData = item.image || "";
      } else {
        document.getElementById('itemName').value = "";
        document.getElementById('itemTemp').value = "180";
        document.getElementById('itemTime').value = "10";
        editingImageData = "";
      }
      updatePreview();
      modal.classList.add('active');
    };

    window.closeModal = () => {
      modal.classList.remove('active');
    };

    // 保存フォーム送信
    document.getElementById('recipeForm').onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const temp = document.getElementById('itemTemp').value;
      const time = document.getElementById('itemTime').value;

      if (currentEditId) {
        const item = items.find(i => i.id === currentEditId);
        item.name = name;
        item.temp = temp;
        item.time = time;
        item.image = editingImageData;
      } else {
        items.push({
          id: Date.now().toString(),
          name,
          temp,
          time,
          image: editingImageData
        });
      }

      saveData();
      closeModal();
    };

    searchInput.oninput = render;

    // 初期化実行
    initDataSync();
  </script>
</head>
<body>

  <header>
    <h1>COSORI 調理メモ (共有版)</h1>
  </header>

  <div class="controls">
    <input type="text" id="search" class="search-bar" placeholder="食品名で検索...">
  </div>

  <div id="grid" class="grid"></div>

  <button class="fab" onclick="openModal()">＋</button>

  <!-- 追加・修正モーダル -->
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <h3 style="margin-top:0;">食品情報の登録・修正</h3>
      <form id="recipeForm">
        <div class="form-group">
          <label>食品名</label>
          <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
          <label>設定温度 (℃)</label>
          <input type="number" id="itemTemp" required>
        </div>
        <div class="form-group">
          <label>調理時間 (分)</label>
          <input type="number" id="itemTime" required>
        </div>
        <div class="form-group">
          <label>写真の追加・差し替え</label>
          <input type="file" id="imgInput" accept="image/*">
          <div id="imgPreview" class="img-preview">画像未選択</div>
          <button type="button" id="removeImgBtn" class="btn btn-danger" style="margin-top:6px; display:none;">画像を削除</button>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
          <button type="button" class="btn" onclick="closeModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
